```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloxd Spotify</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0d;color:#fff;font-family:Arial,sans-serif}
.box{width:360px;padding:30px;text-align:center;background:#151518;border:1px solid #ffffff1a;border-radius:20px;box-shadow:0 25px 70px #0008}
.logo{width:70px;height:70px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1ed760;color:#000;font-size:36px}
h1{margin:0 0 10px;font-size:24px}
#status{color:#ffffff8c;font-size:14px;line-height:1.5}
</style>
</head>
<body>

<div class="box">
<div class="logo">♫</div>
<h1>Bloxd Spotify</h1>
<div id="status">Connecting...</div>
</div>

<script>
const CLIENT_ID="YOUR_CLIENT_ID";
const REDIRECT_URI="https://realcherryy.github.io/bloxd-spotify/";

const status=document.getElementById("status");
const params=new URLSearchParams(location.search);
const code=params.get("code");
const error=params.get("error");
const state=params.get("state");

async function finish(){
    if(error){
        status.textContent="Spotify login was cancelled.";
        return;
    }

    if(!code){
        status.textContent="No authorization code.";
        return;
    }

    const savedState=localStorage.getItem("bloxd_spotify_state");
    const verifier=localStorage.getItem("bloxd_spotify_verifier");

    if(!savedState||state!==savedState){
        status.textContent="Security check failed.";
        return;
    }

    if(!verifier){
        status.textContent="PKCE verifier missing.";
        return;
    }

    try{
        status.textContent="Connecting Spotify...";

        const response=await fetch("https://accounts.spotify.com/api/token",{
            method:"POST",
            headers:{
                "Content-Type":"application/x-www-form-urlencoded"
            },
            body:new URLSearchParams({
                client_id:CLIENT_ID,
                grant_type:"authorization_code",
                code:code,
                redirect_uri:REDIRECT_URI,
                code_verifier:verifier
            })
        });

        const data=await response.json();

        if(!response.ok){
            throw new Error(data.error_description||"Spotify authentication failed.");
        }

        localStorage.setItem("bloxd_spotify_access_token",data.access_token);

        if(data.refresh_token){
            localStorage.setItem("bloxd_spotify_refresh_token",data.refresh_token);
        }

        if(data.expires_in){
            localStorage.setItem(
                "bloxd_spotify_expires_at",
                String(Date.now()+data.expires_in*1000)
            );
        }

        localStorage.removeItem("bloxd_spotify_state");
        localStorage.removeItem("bloxd_spotify_verifier");

        history.replaceState({},document.title,REDIRECT_URI);

        status.textContent="Connected! Returning to Bloxd...";

        setTimeout(()=>{
            location.href="https://bloxd.io/";
        },1200);

    }catch(e){
        console.error(e);
        status.textContent=e.message;
    }
}

finish();
</script>

</body>
</html>
