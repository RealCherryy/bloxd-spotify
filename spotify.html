<html lang="en">
<head>
    <meta charset="UTF-8">

        * {

        }

        }

        .logo {
            width: 70px;

            margin: 0 0 10px;

        }

        #status {
            color: rgba(255,255,255,.55);
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">♫</div>

    <h1>Bloxd Spotify</h1>

    <div id="status">
        Connecting to Spotify...
    </div>

</div>

<script>

    // =====================================================
    // YOUR SPOTIFY APP
    // =====================================================

    const CLIENT_ID = "YOUR_CLIENT_ID";

    // IMPORTANT:
    // This MUST be exactly the same as the Redirect URI
    // you put in your Spotify Developer Dashboard.

    const REDIRECT_URI =
        "https://YOUR_USERNAME.github.io/bloxd-spotify/spotify.html";


    // =====================================================
    // STATUS
    // =====================================================

    const status =
        document.getElementById("status");


    // =====================================================
    // GET URL PARAMETERS
    // =====================================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");

    const error =
        params.get("error");

    const state =
        params.get("state");


    // =====================================================
    // CHECK FOR ERRORS
    // =====================================================

    if (error) {

        status.textContent =
            "Spotify login was cancelled.";

    } else if (!code) {

        status.textContent =
            "No Spotify authorization code found.";

    } else {

        exchangeCode(code);
    }


    // =====================================================
    // BASE64 URL
    // =====================================================

    function base64url(buffer) {

        return btoa(
            String.fromCharCode(
                ...new Uint8Array(buffer)
            )
        )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
    }


    // =====================================================
    // EXCHANGE AUTHORIZATION CODE
    // =====================================================

    async function exchangeCode(code) {

        try {

            status.textContent =
                "Finishing Spotify connection...";


            // Get PKCE verifier created by
            // the Bloxd userscript.

            const verifier =
                sessionStorage.getItem(
                    "bloxd_spotify_code_verifier"
                );


            if (!verifier) {

                throw new Error(
                    "PKCE verifier was not found."
                );
            }


            // Exchange authorization code
            // for an access token.

            const response =
                await fetch(
                    "https://accounts.spotify.com/api/token",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({

                                client_id:
                                    CLIENT_ID,

                                grant_type:
                                    "authorization_code",

                                code:
                                    code,

                                redirect_uri:
                                    REDIRECT_URI,

                                code_verifier:
                                    verifier
                            })
                    }
                );


            if (!response.ok) {

                const text =
                    await response.text();

                throw new Error(text);
            }


            const data =
                await response.json();


            // Save the access token locally.

            localStorage.setItem(
                "bloxd_spotify_access_token",
                data.access_token
            );


            // Save refresh token if provided.

            if (data.refresh_token) {

                localStorage.setItem(
                    "bloxd_spotify_refresh_token",
                    data.refresh_token
                );
            }


            // Save expiry time.

            if (data.expires_in) {

                localStorage.setItem(
                    "bloxd_spotify_expires_at",

                    String(
                        Date.now() +
                        data.expires_in * 1000
                    )
                );
            }


            status.textContent =
                "Spotify connected! Returning to Bloxd...";


            // Return to Bloxd.

            setTimeout(() => {

                window.location.href =
                    "https://bloxd.io/";

            }, 1200);


        } catch (error) {

            console.error(error);

            status.textContent =
                "Spotify connection failed: " +
                error.message;
        }
    }

</script>

</body>
</html>
